services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CLUBMAX_DATABASE_NAME}
      POSTGRES_USER: ${CLUBMAX_DATABASE_USER}
      POSTGRES_PASSWORD: ${CLUBMAX_DATABASE_PASSWORD}
    ports:
      - "${CLUBMAX_SERVER_IP}:${CLUBMAX_DATABASE_PORT}:5432"
    volumes:
      - clubmax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLUBMAX_DATABASE_USER} -d ${CLUBMAX_DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clubmax_postgres_data:
